services:
  backend:
    build:
      context: ./Server
    container_name: bakaziki-backend
    ports:
      - "5000:5000"
    env_file:
      - ./Server/.env
    restart: unless-stopped
   

  frontend:
    build:
      context: ./Client
    container_name: bakaziki-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./Client/.env
    depends_on:
      - backend
    restart: unless-stopped

