name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  code_quality:
    name: Code Quality & Build Validation
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3: Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: ./Client
        run: npm ci

      # Step 4: Run frontend lint
      - name: Frontend lint
        working-directory: ./Client
        run: npm run lint

      # Step 5: Build frontend
      - name: Build frontend
        working-directory: ./Client
        run: npm run build

      # Step 6: Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./Server
        run: npm ci

      # Step 7: Run backend lint
      - name: Backend lint
        working-directory: ./Server
        run: npm run lint

  secret_scan:
      name: Secret Scanning (Gitleaks)
      runs-on: ubuntu-latest
      needs: code_quality

      steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2      

  codeql_scan:
    name: Static Application Security Testing (CodeQL)
    runs-on: ubuntu-latest
    needs: secret_scan

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ "javascript" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  dependency_scan:
    name: Dependency Vulnerability Scan (npm audit)
    runs-on: ubuntu-latest
    needs: codeql_scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Frontend audit
      - name: Install frontend dependencies
        working-directory: ./Client
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: ./Client
        run: npm audit --audit-level=high

      # Backend audit
      - name: Install backend dependencies
        working-directory: ./Server
        run: npm ci

      - name: Audit backend dependencies
        working-directory: ./Server
        run: npm audit --audit-level=high

  docker_build_scan:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: dependency_scan

    permissions:
      contents: read

    env:
      BACKEND_IMAGE: riya2612/bakaziki-backend
      FRONTEND_IMAGE: riya2612/bakaziki-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build \
            -t $BACKEND_IMAGE:${{ github.sha }} \
            -t $BACKEND_IMAGE:latest \
            -f Server/Dockerfile \
            Server

      - name: Build frontend image
        run: |
          docker build \
            -t $FRONTEND_IMAGE:${{ github.sha }} \
            -t $FRONTEND_IMAGE:latest \
            -f Client/Dockerfile \
            Client

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image to Docker Hub
        run: |
          docker push $BACKEND_IMAGE:${{ github.sha }}

      - name: Push frontend image to Docker Hub
        run: |
          docker push $FRONTEND_IMAGE:${{ github.sha }}
        
  kubernetes_scan:
    name: Kubernetes Manifest Scan (Trivy Config)
    runs-on: ubuntu-latest
    needs: docker_build_scan

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Kubernetes manifests
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: ./K8S
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

  checkov_scan:
    name: Infrastructure as Code Scan (Checkov)
    runs-on: ubuntu-latest
    needs: kubernetes_scan

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: kubernetes
          quiet: true
          skip_check: CKV_K8S_43,CKV_K8S_14,CKV_K8S_35
